[package]
name = "airdrop"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22.1"
bincode = "1.3"
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
solana-hash = "4.3.0"
solana-instruction = "3.0.0"
solana-keypair = "3.1.2"
solana-message = { version = "4.0.0", features = ["serde"] }
solana-pubkey = { version = "4.2.0", features = ["curve25519"] }
solana-transaction = { version = "4.0.0", features = ["serde"] }
spl-token-2022-interface = "3.0.0"
thiserror = "2.0.18"
toml = "1.1.2"
